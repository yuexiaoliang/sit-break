name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build & publish release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sit Break ${{ github.ref_name }}"
          releaseBody: "Download the installer below. 下载下面的安装包即可安装使用。"
          releaseDraft: false
          prerelease: false

      - name: Upload portable exe
        run: gh release upload ${{ github.ref_name }} src-tauri/target/release/sit-break.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
