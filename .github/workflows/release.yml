name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build & publish (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Sit Break ${{ github.ref_name }}"
          releaseBody: |
            ## 简体中文

            macOS 下载通用 DMG，支持 Apple Silicon 与 Intel；Windows 下载安装程序或免安装版。

            [完整更新说明](https://github.com/${{ github.repository }}/blob/main/docs/releases/${{ github.ref_name }}.md) · [中文使用说明](https://github.com/${{ github.repository }}/blob/main/README.zh-CN.md)

            ## English

            macOS: download the universal DMG for Apple Silicon and Intel. Windows: download the installer or portable executable.

            [Full release notes](https://github.com/${{ github.repository }}/blob/main/docs/releases/${{ github.ref_name }}.en.md) · [User guide](https://github.com/${{ github.repository }}/blob/main/README.md)
          releaseDraft: false
          prerelease: false

      - name: Upload portable exe
        if: matrix.platform == 'windows-latest'
        run: gh release upload ${{ github.ref_name }} src-tauri/target/release/sit-break.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
