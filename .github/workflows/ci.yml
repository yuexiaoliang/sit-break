name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check & build frontend (tsc + vite)
        run: npm run build

      - name: Frontend interaction tests
        run: npm test

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cargo binary build
        working-directory: src-tauri
        run: cargo build --locked --bin sit-break

      - name: macOS 原生浮窗边界
        if: runner.os == 'macOS'
        timeout-minutes: 2
        working-directory: src-tauri
        run: cargo run --locked --example reminder_window_check -- "${{ runner.temp }}/sit-break-window-check.json"

      - name: 上传 macOS 原生定位报告
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-native-window-check
          path: ${{ runner.temp }}/sit-break-window-check.json
          if-no-files-found: warn
          retention-days: 14

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo tests
        working-directory: src-tauri
        run: cargo test --locked --lib
