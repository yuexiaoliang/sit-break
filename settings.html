<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Sit Break</title>
  <link rel="stylesheet" href="/src/ui.css" />
</head>
<body class="settings-page">
  <div class="scard">
    <div class="shead">
      <h3><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span data-i18n="settings">设置</span></h3>
      <button class="sclose" id="btnClose" title="关闭"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <div class="frow">
      <label data-i18n="interval">提醒间隔</label>
      <span><input type="number" id="workMin" min="1" max="240" /><span class="unit"><span data-i18n="minutesUnit">分钟</span></span></span>
    </div>
    <div class="frow">
      <label data-i18n="ballSize">悬浮球大小</label>
      <span><input type="number" id="widgetSize" min="40" max="140" /><span class="unit">px</span></span>
    </div>
    <div class="frow">
      <label data-i18n="breakLen">休息时长</label>
      <span><input type="number" id="breakMin" min="1" max="60" /><span class="unit"><span data-i18n="minutesUnit">分钟</span></span></span>
    </div>
    <div class="frow">
      <label data-i18n="language">语言</label>
      <span class="selwrap"><select id="language"><option value="system" data-i18n="langSys">跟随系统</option><option value="zh">中文</option><option value="en">English</option></select></span>
    </div>

    <div class="toggles">
      <div class="frow">
        <label data-i18n="sound">提示音</label>
        <span class="switch" id="swSound"><span class="track"></span><span class="knob"></span></span>
      </div>
      <div class="frow">
        <label data-i18n="showWidget">显示悬浮计时条</label>
        <span class="switch" id="swWidget"><span class="track"></span><span class="knob"></span></span>
      </div>
      <div class="frow">
        <label data-i18n="autostart">开机自启</label>
        <span class="switch" id="swAuto"><span class="track"></span><span class="knob"></span></span>
      </div>
    </div>

    <div class="ftips">
      <label data-i18n="tipsLabel">提醒小字（每行一条，随机展示）</label>
      <textarea id="tipsList" rows="5" spellcheck="false"></textarea>
    </div>

    <button class="save" id="btnSave"><span data-i18n="save">保存</span></button>
  </div>
  <div class="toast" id="toast" data-i18n="saved">已保存 ✓</div>
  <script type="module" src="/src/settings.ts"></script>
</body>
</html>
