<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sit Break</title>
  <link rel="stylesheet" href="/src/settings.css" />
</head>
<body class="settings-page">
  <div class="scard">
    <header class="shead" data-tauri-drag-region>
      <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <strong>Sit Break</strong><span class="header-slash">/</span><span class="header-label" data-i18n="settingsTitle">设置</span>
      <button type="button" id="btnClose" class="close-button" data-i18n-label="closeSettings" aria-label="关闭设置"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </header>
    <form id="settingsForm" class="sbody">
      <div class="page-heading"><h1 id="pageTitle">简单计时</h1><p id="pageDescription">设定工作与休息时长，到点提醒你。</p></div>
      <section id="simpleSettings" class="simple-settings">
        <div class="durations">
          <div class="simple-duration"><label for="workMin" data-i18n="workLength">工作时长</label><div class="duration-field"><input id="workMin" type="number" min="1" max="240" step="1" required value="45" /><span data-i18n="minutesUnit">分钟</span></div><div class="duration-presets" data-duration="workMin"><button type="button" data-minutes="15">15</button><button type="button" data-minutes="30">30</button><button type="button" data-minutes="45">45</button><button type="button" data-minutes="60">60</button></div></div>
          <div class="simple-duration"><label for="breakMin" data-i18n="breakLen">休息时长</label><div class="duration-field"><input id="breakMin" type="number" min="1" max="60" step="1" required value="5" /><span data-i18n="minutesUnit">分钟</span></div><div class="duration-presets" data-duration="breakMin"><button type="button" data-minutes="3">3</button><button type="button" data-minutes="5">5</button><button type="button" data-minutes="10">10</button></div></div>
        </div>
        <p id="simpleSummary" class="simple-summary"></p>
      </section>
      <div class="mode-row"><div><strong id="useScheduleLabel" data-i18n="useSchedule">使用日程</strong><p id="modeDescription" class="muted"></p></div><button type="button" id="swSchedule" class="switch" role="switch" aria-labelledby="useScheduleLabel" aria-checked="false"></button></div>
      <section id="scheduleSettings" hidden>
        <div id="scheduleList"></div>
        <div id="emptySchedules" class="empty-periods"><h2 data-i18n="emptySchedules">还没有日程</h2><p data-i18n="emptySchedulesDescription">添加一份日程，安排自己的节奏。没有执行时段时保持待机。</p></div>
        <button type="button" id="addSchedule" class="secondary-button" data-i18n="addSchedule">＋ 添加日程</button>
      </section>
      <section class="common-settings">
        <div class="common-heading"><h2 data-i18n="commonSettings">通用设置</h2><span data-i18n="sharedSettings">两种计时方式共用</span></div>
        <div class="preference-row"><label for="language" data-i18n="language">语言</label><select id="language"><option value="system" data-i18n="langSys">跟随系统</option><option value="zh">简体中文</option><option value="en">English</option></select></div>
        <div class="preference-row"><div><strong id="soundLabel" data-i18n="sound">提示音</strong><p data-i18n="soundDescription">提醒时播放轻柔提示音</p></div><button type="button" id="swSound" class="switch" role="switch" aria-labelledby="soundLabel" aria-checked="true"></button></div>
        <div class="preference-row"><div><strong id="autoLabel" data-i18n="autostart">开机自启</strong><p data-i18n="autostartDescription">登录电脑后自动开始</p></div><button type="button" id="swAuto" class="switch" role="switch" aria-labelledby="autoLabel" aria-checked="false"></button></div>
        <div class="preference-row"><div><strong id="idleResetLabel" data-i18n="idleReset">离开自动重置</strong><p data-i18n="idleDescription">离开达到休息时长，重新计时</p></div><button type="button" id="swIdleReset" class="switch" role="switch" aria-labelledby="idleResetLabel" aria-checked="true"></button></div>
        <div class="preference-row" data-widget-setting><strong id="widgetLabel" data-i18n="showWidget">显示悬浮计时条</strong><button type="button" id="swWidget" class="switch" role="switch" aria-labelledby="widgetLabel" aria-checked="true"></button></div>
        <div class="preference-row" data-widget-setting><label for="widgetSize" data-i18n="ballSize">悬浮计时条大小</label><div class="size-field"><input id="widgetSize" type="number" min="40" max="140" step="1" required value="64" /><span>px</span></div></div>
        <div class="tips-editor"><label for="tipsList" data-i18n="tipsHeading">提醒小字</label><span data-i18n="tipsHint">每行一条，随机展示</span><textarea id="tipsList" rows="3"></textarea><p data-i18n="tipsDescription">留空时使用默认提示。</p></div>
      </section>
      <footer class="bottom-actions"><p id="saveStatus" role="status" aria-live="polite"></p><button type="submit" id="btnSave" class="save-button" data-i18n="saveSettings">保存设置</button></footer>
    </form>
  </div>
  <script type="module" src="/src/settings.ts"></script>
</body>
</html>
