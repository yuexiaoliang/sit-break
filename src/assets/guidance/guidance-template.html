<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的休息指引</title>
  <style>
    :root {
      color-scheme: light dark;
      --sb-background: #ffffff;
      --sb-surface: #f0f8f4;
      --sb-text: #1f2a24;
      --sb-text-secondary: #52665a;
      --sb-border: #d7e6dd;
      --sb-accent: #1d7a56;
      --sb-accent-strong: #176044;
      --sb-on-accent: #ffffff;
      --sb-accent-soft: rgba(47, 193, 134, .1);
      --sb-accent-border: rgba(29, 122, 86, .22);
      --sb-control-background: rgba(31, 174, 116, .08);
      --sb-control-hover: rgba(31, 174, 116, .15);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sb-background: #181d1b;
        --sb-surface: #202b25;
        --sb-text: #eef4f0;
        --sb-text-secondary: #aebcb3;
        --sb-border: #35483d;
        --sb-accent: #4fe0a8;
        --sb-accent-strong: #2fc186;
        --sb-on-accent: #10261c;
        --sb-accent-soft: rgba(79, 224, 168, .12);
        --sb-accent-border: rgba(79, 224, 168, .2);
        --sb-control-background: rgba(255, 255, 255, .07);
        --sb-control-hover: rgba(255, 255, 255, .12);
      }
    }
    * { box-sizing: border-box; }
    html { height: 100%; background: var(--sb-background); }
    body { margin: 0; padding: 12px; min-width: 0; overflow-wrap: anywhere; color: var(--sb-text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 7px; font-size: 19px; line-height: 1.3; }
    p { margin: 0 0 10px; }
    .intro { color: var(--sb-text-secondary); }
    .steps { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .steps li { display: flex; align-items: baseline; gap: 9px; padding: 8px 10px; border-radius: 9px; background: var(--sb-surface); }
    .step { flex: 0 0 20px; color: var(--sb-accent); font-weight: 700; }
    details { margin-top: 10px; border: 1px solid var(--sb-border); border-radius: 9px; padding: 8px 10px; }
    summary { cursor: pointer; font-weight: 600; }
    details p { color: var(--sb-text-secondary); margin: 8px 0 0; }
    button { margin-top: 10px; border: 1px solid var(--sb-accent-border); border-radius: 8px; padding: 7px 12px; background: var(--sb-accent-soft); color: var(--sb-accent); font: inherit; cursor: pointer; }
    button:hover { background: var(--sb-control-hover); }
    button:focus-visible, summary:focus-visible { outline: 2px solid var(--sb-accent); outline-offset: 3px; }
    .confirmation { min-height: 1.5em; margin: 6px 0 0; color: var(--sb-text-secondary); font-size: 12px; }
    @media (prefers-reduced-motion: no-preference) { button { transition: background .15s ease; } }
    @media (max-width: 260px) { body { padding: 8px; } h1 { font-size: 17px; } .steps li { padding: 7px; } }
  </style>
</head>
<body>
  <main>
    <!-- 替换这里的标题、说明和步骤。保留完整语义配色与系统主题媒体查询。 -->
    <h1>我的休息指引</h1>
    <p class="intro">在这里写一段简短的内容说明。</p>
    <ol class="steps">
      <li><span class="step">1</span><span>替换为第一个要点。</span></li>
      <li><span class="step">2</span><span>替换为第二个要点。</span></li>
      <li><span class="step">3</span><span>替换为第三个要点。</span></li>
    </ol>
    <details>
      <summary>更多说明</summary>
      <p>较长的补充内容放在这里，可折叠以节省空间。页面内容较长时，在网页区域内滚动。休息倒计时和结束操作由浮窗提供，无须在页面中重复。</p>
    </details>
    <button type="button" id="read" aria-pressed="false">我已读完</button>
    <p class="confirmation" id="confirmation" role="status"></p>
  </main>
  <script>
    const button = document.getElementById("read");
    const confirmation = document.getElementById("confirmation");
    button.addEventListener("click", () => {
      const marked = button.getAttribute("aria-pressed") !== "true";
      button.setAttribute("aria-pressed", String(marked));
      button.textContent = marked ? "已读 · 点击撤销" : "我已读完";
      confirmation.textContent = marked ? "你可以继续查看或收起要点。" : "";
    });
  </script>
</body>
</html>
